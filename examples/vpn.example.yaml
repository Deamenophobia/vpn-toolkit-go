version: 1
engine: sing-box-anytls
state_dir: private
server:
  address: vpn.example.com
  port: 443
  listen: 0.0.0.0
  dns: 1.1.1.1
  log_level: warn
tls:
  server_name: vpn.example.com
  certificate: /etc/vpn-toolkit/tls/fullchain.pem
  key: /etc/vpn-toolkit/tls/privkey.pem
client:
  mode: tun
  mixed_port: 7890
  dns_listen_port: 1053
  ipv6: block
  dns:
    - https://1.1.1.1/dns-query
  bootstrap_dns:
    - https://1.1.1.1/dns-query
  udp: true

